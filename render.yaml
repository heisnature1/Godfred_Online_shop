services:
  - type: web
    name: godfred-online-shop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data --skip-demo-user
    startCommand: gunicorn shopnow.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: godfred-online-shop-db
          property: connectionString

databases:
  - name: godfred-online-shop-db
    databaseName: godfred_online_shop
    user: godfred_online_shop
    plan: free
